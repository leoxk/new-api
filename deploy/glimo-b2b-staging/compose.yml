name: glimo-b2b-staging

services:
  new-api:
    image: ${NEW_API_IMAGE:?NEW_API_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: https://staging-llm.glimolab.com
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TZ: Asia/Manila
      NODE_NAME: glimo-b2b-payment-staging
      ERROR_LOG_ENABLED: "true"
      MEMORY_CACHE_ENABLED: "true"
      GLIMO_B2B_GPT_IMAGE_ENABLED: "false"
      BATCH_UPDATE_ENABLED: "false"
      GENERATE_DEFAULT_TOKEN: "false"
      STRIPE_API_SECRET: ${STRIPE_API_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - new-api-data:/data
      - new-api-logs:/app/logs
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  staging-network:
    name: glimo-b2b-staging-network

volumes:
  new-api-data:
    name: glimo-b2b-staging-new-api-data
  new-api-logs:
    name: glimo-b2b-staging-new-api-logs
  postgres-data:
    name: glimo-b2b-staging-postgres-data
  redis-data:
    name: glimo-b2b-staging-redis-data
