name: Glimo B2B staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build, push, and deploy to the protected staging environment
        required: true
        default: false
        type: boolean
      rollback_image:
        description: Optional immutable GHCR image tag/digest to deploy instead of this commit
        required: false
        type: string
      sync_test_customer:
        description: Reset the controlled b2btest password from the protected staging secret
        required: true
        default: false
        type: boolean

concurrency:
  group: glimo-b2b-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check and build frontend
        working-directory: web/default
        run: bun run build:check

      - name: Prepare classic embed fixture for backend tests
        run: |
          mkdir -p web/classic/dist
          printf '<!doctype html><title>test fixture</title>\n' > web/classic/dist/index.html

      - name: Test backend
        run: go test ./...

  image:
    if: ${{ inputs.deploy }}
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        run: |
          if [ -n "$ROLLBACK_IMAGE" ]; then
            image="$ROLLBACK_IMAGE"
          else
            image="ghcr.io/${REPOSITORY,,}:staging-${SHA}"
          fi
          echo "value=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ inputs.rollback_image == '' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable staging image
        if: ${{ inputs.rollback_image == '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  sync-test-customer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_test_customer }}
    needs: verify
    runs-on: ubuntu-latest
    environment: glimo-gateway-staging
    permissions:
      contents: read
    steps:
      - name: Reset and verify controlled staging customer
        env:
          STAGING_ADMIN_ACCESS_TOKEN: ${{ secrets.STAGING_ADMIN_ACCESS_TOKEN }}
          STAGING_CUSTOMER_PASSWORD: ${{ secrets.STAGING_CUSTOMER_PASSWORD }}
          STAGING_PUBLIC_HEALTH_URL: ${{ vars.STAGING_PUBLIC_HEALTH_URL }}
        run: |
          : "${STAGING_ADMIN_ACCESS_TOKEN:?missing staging admin access token}"
          : "${STAGING_CUSTOMER_PASSWORD:?missing staging customer password}"
          : "${STAGING_PUBLIC_HEALTH_URL:?missing staging public health URL}"

          base_url="${STAGING_PUBLIC_HEALTH_URL%/api/status}"
          user_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $STAGING_ADMIN_ACCESS_TOKEN" \
            -H "New-Api-User: 1" \
            "$base_url/api/user/3")"
          if [ "$(jq -r '.success' <<<"$user_json")" != true ] || \
             [ "$(jq -r '.data.username' <<<"$user_json")" != b2btest ] || \
             [ "$(jq -r '.data.group' <<<"$user_json")" != b2b ]; then
            echo "Refusing to update an unexpected staging user" >&2
            exit 1
          fi

          payload="$(jq -cn --arg password "$STAGING_CUSTOMER_PASSWORD" '{
            id: 3,
            username: "b2btest",
            display_name: "B2B Test Customer",
            password: $password,
            group: "b2b",
            remark: "Controlled B2B payment staging customer"
          }')"
          update_json="$(curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $STAGING_ADMIN_ACCESS_TOKEN" \
            -H "New-Api-User: 1" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base_url/api/user/")"
          if [ "$(jq -r '.success' <<<"$update_json")" != true ]; then
            echo "Controlled staging customer reset failed" >&2
            exit 1
          fi

          login_payload="$(jq -cn --arg password "$STAGING_CUSTOMER_PASSWORD" '{
            username: "b2btest",
            password: $password
          }')"
          login_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$login_payload" \
            "$base_url/api/user/login")"
          if [ "$(jq -r '.success' <<<"$login_json")" != true ] || \
             [ "$(jq -r '.data.id' <<<"$login_json")" != 3 ] || \
             [ "$(jq -r '.data.group' <<<"$login_json")" != b2b ]; then
            echo "Controlled staging customer login verification failed" >&2
            exit 1
          fi

          echo "Controlled staging customer reset and login verification passed"

  deploy:
    if: ${{ inputs.deploy }}
    needs: image
    runs-on: ubuntu-latest
    environment: glimo-gateway-staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure ephemeral SSH client
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          cat > "$RUNNER_TEMP/ssh/config" <<EOF
          Host glimo-staging
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER }}
            IdentityFile $RUNNER_TEMP/ssh/key
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 0600 "$RUNNER_TEMP/ssh/config"

      - name: Transfer and execute version-controlled deployment script
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          STAGING_LOCAL_HEALTH_URL: ${{ vars.STAGING_LOCAL_HEALTH_URL }}
          STAGING_PUBLIC_HEALTH_URL: ${{ vars.STAGING_PUBLIC_HEALTH_URL }}
          STAGING_RUNTIME_ENV: ${{ secrets.STAGING_RUNTIME_ENV }}
          STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          : "${STRIPE_API_SECRET:?missing Stripe sandbox secret}"
          : "${STRIPE_WEBHOOK_SECRET:?missing Stripe webhook secret}"
          : "${STRIPE_PRICE_ID:?missing Stripe unit price ID}"
          remote_script="/tmp/glimo-b2b-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_compose="/tmp/glimo-b2b-compose-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
          remote_env="/dev/shm/glimo-b2b-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          install -m 0600 /dev/null "$RUNNER_TEMP/runtime.env"
          printf '%s\n' "$STAGING_RUNTIME_ENV" > "$RUNNER_TEMP/runtime.env"
          printf '%s=%s\n' \
            STRIPE_API_SECRET "$STRIPE_API_SECRET" \
            STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET" \
            STRIPE_PRICE_ID "$STRIPE_PRICE_ID" \
            >> "$RUNNER_TEMP/runtime.env"
          scp -F "$RUNNER_TEMP/ssh/config" scripts/deploy-glimo-b2b-staging.sh "glimo-staging:$remote_script"
          scp -F "$RUNNER_TEMP/ssh/config" deploy/glimo-b2b-staging/compose.yml "glimo-staging:$remote_compose"
          scp -F "$RUNNER_TEMP/ssh/config" "$RUNNER_TEMP/runtime.env" "glimo-staging:$remote_env"
          ssh -F "$RUNNER_TEMP/ssh/config" glimo-staging \
            "chmod 0700 '$remote_script' && chmod 0600 '$remote_env' && '$remote_script' '$DEPLOY_PATH' '$IMAGE' '$STAGING_LOCAL_HEALTH_URL' '$STAGING_PUBLIC_HEALTH_URL' '$remote_env' '$remote_compose'; status=\$?; rm -f '$remote_script' '$remote_env' '$remote_compose'; exit \$status"

      - name: Verify public staging endpoint from runner
        env:
          STAGING_PUBLIC_HEALTH_URL: ${{ vars.STAGING_PUBLIC_HEALTH_URL }}
        run: curl --fail --silent --show-error "$STAGING_PUBLIC_HEALTH_URL"

      - name: Remove ephemeral credentials
        if: always()
        run: |
          find "$RUNNER_TEMP/ssh" -type f -delete 2>/dev/null || true
          find "$RUNNER_TEMP/ssh" -type d -empty -delete 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 1 -name runtime.env -type f -delete 2>/dev/null || true
