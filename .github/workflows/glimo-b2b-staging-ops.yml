name: Glimo B2B staging operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation to run
        required: true
        type: choice
        options:
          - record_completed_stripe_refund
          - sync_b2b_catalog_policy
          - verify_b2b_catalog_gate
      trade_no:
        description: Exact New API staging top-up order number
        required: false
        type: string
      provider_refund_id:
        description: Completed Stripe Sandbox refund ID (re_...)
        required: false
        type: string
      refunded_money:
        description: Completed refund amount in USD (maximum two decimals)
        required: false
        type: string
      reason:
        description: Audit reason for the completed refund
        required: false
        type: string

concurrency:
  group: glimo-b2b-staging-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record-completed-stripe-refund:
    if: ${{ inputs.operation == 'record_completed_stripe_refund' }}
    runs-on: [solstice-deploy, deploy-only, linux-x64]
    environment: glimo-gateway-staging
    steps:
      - name: Validate and record completed Stripe Sandbox refund
        env:
          STAGING_ADMIN_ACCESS_TOKEN: ${{ secrets.STAGING_ADMIN_ACCESS_TOKEN }}
          STAGING_PUBLIC_HEALTH_URL: ${{ vars.STAGING_PUBLIC_HEALTH_URL }}
          TRADE_NO: ${{ inputs.trade_no }}
          PROVIDER_REFUND_ID: ${{ inputs.provider_refund_id }}
          REFUNDED_MONEY: ${{ inputs.refunded_money }}
          REFUND_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          : "${STAGING_ADMIN_ACCESS_TOKEN:?missing staging admin access token}"
          : "${STAGING_PUBLIC_HEALTH_URL:?missing staging public health URL}"
          : "${TRADE_NO:?missing staging top-up order number}"
          : "${PROVIDER_REFUND_ID:?missing Stripe Sandbox refund ID}"
          : "${REFUNDED_MONEY:?missing refund amount}"
          : "${REFUND_REASON:?missing refund reason}"

          if [[ ! "$TRADE_NO" =~ ^ref_[A-Za-z0-9]+$ ]]; then
            echo "Refusing invalid staging order number" >&2
            exit 1
          fi
          if [[ ! "$PROVIDER_REFUND_ID" =~ ^re_[A-Za-z0-9]+$ ]]; then
            echo "Refusing invalid Stripe refund ID" >&2
            exit 1
          fi
          if [[ ! "$REFUNDED_MONEY" =~ ^[0-9]+([.][0-9]{1,2})?$ ]] || \
             ! awk -v amount="$REFUNDED_MONEY" 'BEGIN { exit !(amount > 0) }'; then
            echo "Refund amount must be a positive USD value with at most two decimals" >&2
            exit 1
          fi

          base_url="${STAGING_PUBLIC_HEALTH_URL%/api/status}"
          auth_headers=(
            -H "Authorization: Bearer $STAGING_ADMIN_ACCESS_TOKEN"
            -H "New-Api-User: 1"
          )

          order_json="$(curl --fail-with-body --silent --show-error \
            "${auth_headers[@]}" \
            --get \
            --data-urlencode "keyword=$TRADE_NO" \
            --data-urlencode "page=1" \
            --data-urlencode "page_size=20" \
            "$base_url/api/user/topup")"

          if ! jq -e \
            --arg trade_no "$TRADE_NO" \
            --arg refunded_money "$REFUNDED_MONEY" '
              .success == true and
              ([.data.items[] | select(.trade_no == $trade_no)] | length) == 1 and
              ([.data.items[] | select(.trade_no == $trade_no)][0] |
                .user_id == 3 and
                .status == "success" and
                (.payment_provider == "stripe" or .payment_method == "stripe") and
                (.refunded_money | tonumber) == 0 and
                .provider_refund_id == "" and
                (.money | tonumber) >= ($refunded_money | tonumber)
              )
            ' <<<"$order_json" >/dev/null; then
            echo "Refusing refund: order is not one unrefunded Stripe success order for b2btest" >&2
            exit 1
          fi

          payload="$(jq -cn \
            --arg trade_no "$TRADE_NO" \
            --arg refunded_money "$REFUNDED_MONEY" \
            --arg provider_refund_id "$PROVIDER_REFUND_ID" \
            --arg reason "$REFUND_REASON" \
            '{
              trade_no: $trade_no,
              refunded_money: $refunded_money,
              provider_refund_id: $provider_refund_id,
              reason: $reason
            }')"

          refund_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base_url/api/user/topup/refund-record")"

          if ! jq -e \
            --arg trade_no "$TRADE_NO" \
            --arg provider_refund_id "$PROVIDER_REFUND_ID" \
            --arg refunded_money "$REFUNDED_MONEY" '
              .success == true and
              .data.trade_no == $trade_no and
              .data.provider_refund_id == $provider_refund_id and
              (.data.refunded_money | tonumber) == ($refunded_money | tonumber)
            ' <<<"$refund_json" >/dev/null; then
            echo "Completed refund record could not be verified" >&2
            exit 1
          fi

          echo "Completed Stripe Sandbox refund recorded for the controlled b2btest order"

  sync-b2b-catalog-policy:
    if: ${{ inputs.operation == 'sync_b2b_catalog_policy' }}
    runs-on: [solstice-deploy, deploy-only, linux-x64]
    environment: glimo-gateway-staging
    steps:
      - name: Synchronize the approved B2B auto-routing policy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          STAGING_ADMIN_ACCESS_TOKEN: ${{ secrets.STAGING_ADMIN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?missing staging deployment host}"
          : "${DEPLOY_USER:?missing staging deployment user}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?missing pinned staging host key}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?missing staging deployment key}"
          : "${STAGING_ADMIN_ACCESS_TOKEN:?missing staging admin access token}"

          ssh_dir="$RUNNER_TEMP/catalog-policy-ssh"
          tunnel_port=33101
          tunnel_pid=""
          options_file="$RUNNER_TEMP/catalog-policy-options.json"
          cleanup() {
            status=$?
            if [[ -n "$tunnel_pid" ]]; then
              kill "$tunnel_pid" >/dev/null 2>&1 || true
              wait "$tunnel_pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$ssh_dir"
            rm -f "$options_file"
            exit "$status"
          }
          trap cleanup EXIT

          install -m 0700 -d "$ssh_dir"
          install -m 0600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host glimo-staging
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
            ExitOnForwardFailure yes
          EOF
          chmod 0600 "$ssh_dir/config"

          ssh -F "$ssh_dir/config" -N \
            -L "127.0.0.1:${tunnel_port}:127.0.0.1:3100" \
            glimo-staging &
          tunnel_pid=$!
          base_url="http://127.0.0.1:${tunnel_port}"
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "$base_url/api/status" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$base_url/api/status" >/dev/null

          auth_headers=(
            -H "Authorization: Bearer $STAGING_ADMIN_ACCESS_TOKEN"
            -H "New-Api-User: 1"
          )
          curl --fail-with-body --silent --show-error \
            "${auth_headers[@]}" \
            -o "$options_file" \
            "$base_url/api/option/"
          if [[ "$(jq -r '.success' "$options_file")" != true ]]; then
            echo "Unable to read the current staging options" >&2
            exit 1
          fi

          current_auto_groups="$(jq -er '
            [.data[] | select(.key == "AutoGroups")][0].value | fromjson
          ' "$options_file")"
          updated_auto_groups="$(jq -c '
            . + ["b2b", "b2b-deepseek"] | unique
          ' <<<"$current_auto_groups")"

          current_user_groups="$(jq -er '
            [.data[] | select(.key == "UserUsableGroups")][0].value | fromjson
          ' "$options_file")"
          updated_user_groups="$(jq -c '
            del(.b2b, ."b2b-deepseek")
          ' <<<"$current_user_groups")"

          current_special_groups="$(jq -er '
            [.data[] | select(.key == "group_ratio_setting.group_special_usable_group")][0].value
            | fromjson
          ' "$options_file")"
          updated_special_groups="$(jq -c '
            .b2b = {
              "-:default": "",
              "+:auto": "Auto",
              "+:b2b-deepseek": "DeepSeek"
            }
          ' <<<"$current_special_groups")"

          for option in \
            "$(jq -cn --arg value "$updated_auto_groups" \
              '{key:"AutoGroups", value:$value}')" \
            "$(jq -cn --arg value "$updated_user_groups" \
              '{key:"UserUsableGroups", value:$value}')" \
            "$(jq -cn --arg value "$updated_special_groups" \
              '{key:"group_ratio_setting.group_special_usable_group", value:$value}')"; do
            result="$(curl --fail-with-body --silent --show-error \
              -X PUT \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "$option" \
              "$base_url/api/option/")"
            if [[ "$(jq -r '.success' <<<"$result")" != true ]]; then
              echo "Failed to synchronize one staging B2B catalog option" >&2
              exit 1
            fi
          done

          curl --fail-with-body --silent --show-error \
            "${auth_headers[@]}" \
            -o "$options_file" \
            "$base_url/api/option/"
          if ! jq -e '
            ([.data[] | select(.key == "AutoGroups")][0].value | fromjson) as $auto
            | ([.data[] | select(.key == "UserUsableGroups")][0].value |
                fromjson) as $exposed
            | ([.data[] |
                select(.key == "group_ratio_setting.group_special_usable_group")][0].value |
                fromjson) as $special
            | ($auto | index("b2b")) != null
            and ($auto | index("b2b-deepseek")) != null
            and ($exposed | has("b2b") | not)
            and ($exposed | has("b2b-deepseek") | not)
            and $special.b2b["-:default"] == ""
            and $special.b2b["+:auto"] == "Auto"
            and $special.b2b["+:b2b-deepseek"] == "DeepSeek"
            and ($special.b2b | has("+:default") | not)
          ' "$options_file" >/dev/null; then
            echo "Staging B2B catalog policy did not persist as expected" >&2
            exit 1
          fi

          echo "Staging B2B catalog policy synchronized without exposing internal groups globally"

  verify-b2b-catalog-gate:
    if: ${{ inputs.operation == 'verify_b2b_catalog_gate' }}
    runs-on: [solstice-deploy, deploy-only, linux-x64]
    environment: glimo-gateway-staging
    steps:
      - name: Verify B2B GPT Image is hidden and rejected before routing
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?missing staging deployment host}"
          : "${DEPLOY_USER:?missing staging deployment user}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?missing pinned staging host key}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?missing staging deployment key}"
          ssh_dir="$RUNNER_TEMP/catalog-gate-ssh"
          tunnel_port=33100
          tunnel_pid=""
          models_response_file="$RUNNER_TEMP/catalog-gate-models-response.json"
          models_headers_file="$RUNNER_TEMP/catalog-gate-models-headers.txt"
          response_file="$RUNNER_TEMP/gpt-image-gate-response.json"
          headers_file="$RUNNER_TEMP/gpt-image-gate-headers.txt"
          cleanup() {
            status=$?
            if [[ -n "$tunnel_pid" ]]; then
              kill "$tunnel_pid" >/dev/null 2>&1 || true
              wait "$tunnel_pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$ssh_dir"
            rm -f \
              "$models_response_file" \
              "$models_headers_file" \
              "$response_file" \
              "$headers_file"
            exit "$status"
          }
          trap cleanup EXIT

          install -m 0700 -d "$ssh_dir"
          install -m 0600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host glimo-staging
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
            ExitOnForwardFailure yes
          EOF
          chmod 0600 "$ssh_dir/config"

          ssh -F "$ssh_dir/config" -N \
            -L "127.0.0.1:${tunnel_port}:127.0.0.1:3100" \
            glimo-staging &
          tunnel_pid=$!
          base_url="http://127.0.0.1:${tunnel_port}"
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "$base_url/api/status" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$base_url/api/status" >/dev/null

          customer_key="$(ssh -F "$ssh_dir/config" glimo-staging \
            "container=\$(docker ps \
              --filter label=com.docker.compose.project=glimo-b2b-staging \
              --filter label=com.docker.compose.service=postgres \
              --format '{{.ID}}'); \
             [[ -n \"\$container\" ]] || exit 1; \
             docker exec \"\$container\" sh -lc \
               'psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"SELECT t.key FROM tokens t JOIN users u ON u.id=t.user_id WHERE t.user_id=3 AND u.username='\"'\"'b2btest'\"'\"' AND u.status=1 AND u.\"group\"='\"'\"'b2b'\"'\"' AND u.deleted_at IS NULL AND t.status=1 AND t.\"group\"='\"'\"'auto'\"'\"' AND t.cross_group_retry=false AND (t.expired_time=-1 OR t.expired_time>EXTRACT(EPOCH FROM NOW())::bigint) AND (t.unlimited_quota=true OR t.remain_quota>0) AND COALESCE(t.allow_ips,'\"'\"''\"'\"')='\"'\"''\"'\"' AND t.deleted_at IS NULL ORDER BY t.id DESC LIMIT 1;\"'")"
          if [[ -z "$customer_key" || "$customer_key" == *$'\n'* ]]; then
            echo "No single enabled API key is available for the controlled b2btest customer" >&2
            exit 1
          fi
          if [[ "$customer_key" != sk-* ]]; then
            customer_key="sk-$customer_key"
          fi

          curl --silent --show-error \
            -o "$models_response_file" \
            --dump-header "$models_headers_file" \
            -H "Authorization: Bearer $customer_key" \
            "$base_url/v1/models"
          models_status="$(awk '$1 ~ /^HTTP\// { code=$2 } END { print code }' \
            "$models_headers_file")"
          if [[ "$models_status" != 200 ]]; then
            error_code="$(jq -r '.error.code // "unknown"' "$models_response_file" 2>/dev/null || true)"
            error_category="unknown"
            case "$(jq -r '.error.message // ""' "$models_response_file" 2>/dev/null || true)" in
              *"IP"*) error_category="token_ip_restriction" ;;
              *"封禁"*) error_category="user_disabled" ;;
              *"无权访问"*) error_category="token_group_not_allowed" ;;
              *"已被弃用"*) error_category="token_group_deprecated" ;;
            esac
            echo "B2B model-list authentication failed: HTTP $models_status, code=$error_code, category=$error_category" >&2
            exit 1
          fi
          models_json="$(<"$models_response_file")"
          if jq -e '.data[]? | select(.id == "gpt-image-1" or .id == "gpt-image-2")' \
            <<<"$models_json" >/dev/null; then
            echo "B2B model list still exposes a deferred GPT Image model" >&2
            exit 1
          fi

          curl --silent --show-error \
            -o "$response_file" \
            --dump-header "$headers_file" \
            --request POST \
            -H "Authorization: Bearer $customer_key" \
            -H "Content-Type: application/json" \
            --data '{"model":"gpt-image-2","prompt":"staging catalog gate check"}' \
            "$base_url/v1/images/generations"
          status="$(awk '$1 ~ /^HTTP\// { code=$2 } END { print code }' "$headers_file")"
          if [[ "$status" != 404 ]] || ! jq -e '
            .error.code == "model_not_found" and
            (.error.message | contains("not available for this customer group"))
          ' "$response_file" >/dev/null; then
            echo "B2B GPT Image request was not rejected by the pre-routing catalog gate" >&2
            exit 1
          fi

          echo "B2B catalog gate verified: GPT Image is hidden and rejected before routing"
